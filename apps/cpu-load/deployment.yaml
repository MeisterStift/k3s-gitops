apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-load
  namespace: load-test
spec:
  replicas: 0
  selector:
    matchLabels:
      app: cpu-load
  template:
    metadata:
      labels:
        app: cpu-load
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3s-a1
      containers:
        - name: cpu-load
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              while true; do
                i=0
                while [ "$i" -lt 25000 ]; do
                  i=$((i + 1))
                done
                sleep 0.5
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 25m
              memory: 32Mi
