apiVersion: apps/v1
kind: Deployment
metadata:
  name: target-a
  namespace: kubedoom-targets
spec:
  replicas: 3
  selector:
    matchLabels:
      app: target-a
  template:
    metadata:
      labels:
        app: target-a
    spec:
      containers:
        - name: nginx
          image: nginx:alpine

