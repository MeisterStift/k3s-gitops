---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubedoom
  namespace: kubedoom

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubedoom-pod-manager
  namespace: kubedoom-targets
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
      - delete

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubedoom-pod-manager
  namespace: kubedoom-targets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubedoom-pod-manager
subjects:
  - kind: ServiceAccount
    name: kubedoom
    namespace: kubedoom
