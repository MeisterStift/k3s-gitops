apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubedoom
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/MeisterStift/k3s-gitops.git
    targetRevision: main
    path: apps/kubedoom

  destination:
    server: https://kubernetes.default.svc
    namespace: kubedoom

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
