apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cpu-load
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/<DEIN-BENUTZERNAME>/k3s-gitops.git
    targetRevision: main
    path: apps/cpu-load

  destination:
    server: https://kubernetes.default.svc
    namespace: load-test

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
