grafana:
  enabled: true


  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - grafana.lab.local
    path: /
    pathType: Prefix

  persistence:
    enabled: true
    type: pvc
    storageClassName: longhorn
    accessModes:
      - ReadWriteOnce
    size: 2Gi

prometheus:
  enabled: true

  prometheusSpec:
    replicas: 1
    retention: 1d

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 3Gi

alertmanager:
  enabled: true

  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - alertmanager.lab.local
    paths:
      - /

  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi
